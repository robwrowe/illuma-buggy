[wandsim]
# Or the board's printed IP. WiFi/IP is not persisted across WandSimulator reboots —
# re-run `wifi <ssid> <password>` on the board after every power cycle. No default
# IP is hardcoded in the tool; this hostname is an example only.
base_url = "http://illuma-wandsim.local"

[capture]
device_index = 0
settle_margin_ms = 500       # extra grab time after hold_ms to cover /show dispatch latency
gap_seconds = 1.5            # pause between trials so the light actually stops

# Named ROI sets per zone layout. Run `select-rois --zone-layout <layout>` to fill these
# from the webcam. Layouts are independent — re-running select-rois overwrites that
# layout only. Do not share boxes across layouts; the physical framing differs.
[capture.rois.single]
all = [0, 0, 100, 100]

[capture.rois.five-corner]
topLeft     = [0, 0, 60, 60]
bottomLeft  = [0, 0, 60, 60]
bottomRight = [0, 0, 60, 60]
topRight    = [0, 0, 60, 60]
center      = [0, 0, 60, 60]

[capture.rois.inner-outer]
center = [0, 0, 60, 60]
outer  = [0, 0, 200, 200]

[classify]
# Amplitude below this fraction of the 0–255 channel range is treated as no-signal ("flat").
noise_floor_pct = 0.03
# Template vs. observed Pearson correlation must clear this, else class = "irregular".
min_template_correlation = 0.6
# Rows with confidence below this land in review-needed-*.md even if they "agree".
review_confidence_threshold = 0.6
# Measured period vs xlsx Cycle Length: flag as disagree above this relative error.
cycle_tolerance_pct = 0.25

[discover]
# Minimum trials per bit-group value before a candidate is surfaced.
min_group = 3

[taxonomy]
min_label_purity = 0.6
min_silhouette = 0.25

# macOS C920 lock via `uvc-util` (brew install uvc-util). gain_for_iso_400 is
# the raw UVC gain integer that matches Logitech Camera Settings "ISO 400" on
# THIS unit — not the number 400. Leave null until calibrated (gain step skipped).
[capture.macos_uvc]
camera_index = 0
gain_for_iso_400 = ""

# Palette RGB against this camera lives in gitignored calibration.toml
# (`python -m wave_classifier calibrate-palette`). Not stored here.
